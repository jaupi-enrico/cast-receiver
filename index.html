      // skip prompt, cancel autoplay-next) — mirrors what a sender's own
      // dismiss control does, never a bare no-op while something is showing.
      function onRemoteBack() {
        if (activeSkipSegment) dismissSkipSegment();
        else if (upNext.armed) cancelUpNextFromRemote();
      }

      // A key the platform has no name for arrives as the *string*
      // "Unidentified", which is truthy — so `event.key || map[keyCode]` never
      // reaches the map, and the keyCode table above was dead code. The keys
      // that land here are exactly the ones the table exists for: a TV
      // remote's Back and media buttons. Reject the placeholder explicitly.
      function remoteKeyName(event) {
        if (!event) return "";
        var named = str(event.key, "");
        if (named && named !== "Unidentified") {
          return REMOTE_KEY_ALIASES[named] || named;
        }
        return REMOTE_KEY_CODES[num(event.keyCode, 0)] || "";
      }

      function onRemoteKey(event) {
        if (event.repeat) return; // holding a key shouldn't repeat-fire
        var key = remoteKeyName(event);

        // What a given remote actually emits can't be determined off-device,
        // and an unhandled key is silent by design — so log it. Throttled per
        // key so a leaned-on D-pad can't flood the tunnel, and logged for
        // unrecognized keys too: "which key is your Back button" is precisely
        // the question this has to be able to answer.
        rlogThrottled(
          "remote:" + (key || "?" + num(event.keyCode, 0)),
          2000,
          "[R][remote] key=" + (key || "(unmapped)"),
          "raw=" + str(event.key, "-"),
          "code=" + num(event.keyCode, 0)
        );

        try {
          if (key === "Enter" || key === " ") {
            onRemoteSelect();
          } else if (key === "Backspace" || key === "Escape") {
            onRemoteBack();
          } else if (key === "ArrowLeft") {
            remoteSeekBy(-REMOTE_SEEK_STEP_SECONDS);
          } else if (key === "ArrowRight") {
            remoteSeekBy(REMOTE_SEEK_STEP_SECONDS);
          } else if (key === "MediaPlayPause" || key === "MediaPlay" || key === "MediaPause") {
            togglePlayPause();
          } else {
            return; // not one of ours — leave it alone
          }
          event.preventDefault();
        } catch (e) {
          rlog("[R][remote] key handling failed:", String(e && e.message));
        }
      }

      // Capture phase, deliberately. The key event's target is whatever CAF
      // has focused — normally inside <cast-media-player>'s shadow DOM — and
      // a bubble-phase listener on window only ever sees a key no handler in
      // between chose to stopPropagation(). Capture runs before the target's
      // own handlers and cannot be cut off by them, so this is the only
      // registration that reliably sees a remote's D-pad.
      window.addEventListener("keydown", onRemoteKey, true);

      // ── The other remote path: CEC transport keys ─────────────────────
      // On a Chromecast *dongle* the keydown path above is inert. The stick
      // has no input hardware of its own, and an HDMI-CEC user-control
      // message from the TV is translated by the platform into a Cast **media
      // command**, never into a KeyboardEvent. That asymmetry is exactly what
      // a Samsung remote on a gen-1 shows: play/pause works (PlayerManager
      // handles it via options.supportedCommands in [16]) while OK/Back and
      // the D-pad do nothing whatsoever, because nothing is delivered to the
      // page to handle.
      //
      // So on that hardware the transport keys are the *only* remote input
      // that exists, and they arrive here. Wiring them to the same actions
      // OK/Back drive makes the on-screen Skip and Up Next prompts reachable
      // on a device with no D-pad at all — otherwise the receiver draws a
      // Skip button that physically cannot be pressed except from a sender.
      //
      // Which physical button produces which command is a property of the
      // TV's CEC implementation and cannot be known off-device, so every
      // command is logged. That log is how you find out what a given remote
      // can actually drive.
      function interceptCommand(typeName, handler) {
        var type = messages.MessageType[typeName];
        // Message types drift between CAF builds; an unknown one must be a
        // no-op, not a throw at boot.
        if (type === undefined) return;
        try {
          player.setMessageInterceptor(type, function (req) {
            rlogThrottled("cmd:" + typeName, 1000, "[R][remote] cmd=" + typeName);
            try {
              // `false` means "handled here" — swallow the request so the
              // player doesn't also act on it.
              if (handler && handler(req) === false) return null;
            } catch (e) {
              rlog("[R][remote] cmd handler failed:", String(e && e.message));
            }
            return req;
          });
        } catch (e) {
          rlog("[R][remote] cannot intercept " + typeName);
        }
      }

      // Next/skip-ahead: same contract as OK/Select on a D-pad.
      //
      // Never falls through to the player. There is no CAF queue to advance —
      // this receiver drives its own ([8]) — so a pass-through would be an
      // invalid request against an empty queue, which CAF reports as a player
      // error over a perfectly healthy stream. Every path here is terminal.
      function onRemoteAdvance() {
        if (activeSkipSegment) { performSkip(); return false; }
        if (upNext.armed) { fireUpNext(); return false; }
        if (ctx.contentType === "episode" && canResolve()) {
          ensureQueue().then(function () {
            if (nextEpisode()) playEpisodeAt(ctx.episodeIndex + 1, 0);
          });
        }
        return false;
      }

      // Previous/back: same contract as Back on a D-pad. Terminal for the
      // same reason as above — with nothing on screen this is a no-op, not a
      // queue operation.
      function onRemoteDismiss() {
        if (activeSkipSegment) { dismissSkipSegment(); return false; }
        if (upNext.armed) { cancelUpNextFromRemote(); return false; }
        return false;
      }

      interceptCommand("QUEUE_NEXT", onRemoteAdvance);
      interceptCommand("QUEUE_PREV", onRemoteDismiss);
      interceptCommand("SKIP_AD", function () {
        if (activeSkipSegment) { performSkip(); return false; }
        return false; // no ad break exists here — never hand it to the player
      });
      // Pass-through, logged only — these already behave correctly on their
      // own and exist here to identify which remote button sends what.
      interceptCommand("PLAY", null);
      interceptCommand("PAUSE", null);
      interceptCommand("STOP", null);
      interceptCommand("SEEK", null);

      // ═══ [14] PLAYER EVENTS + TICKER ═════════════════════════════════
      player.addEventListener(cf.events.EventType.MEDIA_STATUS, function (event) {
        var state = event.mediaStatus && event.mediaStatus.playerState;
        var P = messages.PlayerState;

        if (state === P.PLAYING) {
          if (!playingSince) playingSince = Date.now();
          if (phase !== "UPNEXT") {
            if (phase !== "PLAYING") flashBar();
            setPhase("PLAYING");
          }
          // Whether this device's native pipeline lets CAF see the manifest's
          // audio renditions is the one thing SET_AUDIO_TRACK depends on and
          // the one thing that can't be determined off-device. Log it once a
          // minute so "the language picker never appears" is answerable.
          rlogThrottled(
            "atracks",
            60000,
            "[R][ns] audio tracks n=" + audioTracks().length,
            "active=" + activeAudioTrackId()
          );
        } else if (state === P.PAUSED) {
          playingSince = 0;
          if (phase !== "UPNEXT") {
            renderMeta("Paused");
            setPhase("PAUSED");
          }
        } else if (state === P.BUFFERING) {
          playingSince = 0;
          if (phase === "PLAYING") {
            renderMeta("Buffering");
            setPhase("LOADING");
          }
        } else if (state === P.IDLE) {
          playingSince = 0;
          if (phase !== "ERROR" && phase !== "RESOLVING" && phase !== "RECOVERING") {
            setPhase("IDLE");
          }
        }
      });

      player.addEventListener(cf.events.EventType.ERROR, function (event) {
        var code = num(event.detailedErrorCode, 0);
        rlog("[R][error] code=" + code, str(event.reason, ""));

        // 900 is APP: an exception escaped some receiver callback. It says
        // nothing about the media — CAF raises it while a load that is
        // perfectly healthy carries on to play — so tearing the UI down to an
        // error card is wrong, and worse, it hides working playback behind a
        // 5-second "Playback error". Log it (see the window error handler for
        // the actual cause) and let the media speak for itself: if it really
        // is dead, MEDIA_FINISHED/IDLE reports that on its own.
        if (code === APP_ERROR_CODE) return;

        if (RECOVERABLE[code]) recover(code);
        else showError("Playback error", "This stream couldn't be played.", code);
      });

      player.addEventListener(cf.events.EventType.MEDIA_FINISHED, function (event) {
        var reason = event.endedReason;
        if (reason === messages.EndedReason.ERROR) {
          rlog("[R][error] finished with error");
          recover(905);
          return;
        }
        if (reason === messages.EndedReason.END_OF_STREAM) {
          // The outgoing stream reaches its end *after* an up-next fire has
          // already started loading the next episode — ctx.episodeIndex is
          // advanced by then, so advancing again here would skip an episode.
          if (switching) return;
          // Safety net: if the duration was unknown the up-next card never
          // armed, so advance straight from the end of the stream.
          if (upNext.armed) { fireUpNext(); return; }
          if (ctx.autoplayNext && ctx.contentType === "episode" && canResolve()) {
            ensureQueue().then(function () {
              if (nextEpisode()) playEpisodeAt(ctx.episodeIndex + 1, 0);
            });
          }
        }
      });

      // One timer for progress, up-next and state broadcasts. Three timers on
      // a gen-1 is three times the wakeups for no benefit.
      setInterval(function () {
        var state = player.getPlayerState();
        var playing = state === messages.PlayerState.PLAYING;
        var current = num(player.getCurrentTimeSec(), 0);
        var duration = num(player.getDurationSec(), 0) || ctx.durationSeconds || 0;

        if ((playing || state === messages.PlayerState.PAUSED) && current > 0) {
          lastGoodPosition = current;
        }

        // A stretch of healthy playback clears the recovery budget — three
        // hiccups an hour apart must not be terminal.
        if (playing && playingSince && Date.now() - playingSince > RECOVER_RESET_AFTER_MS) {
          if (rr.n) rlog("[R][recover] budget reset after clean playback");
          resetRecovery();
        }

        if (duration > 0) {
          el["b-fill"].style.width =
            Math.max(0, Math.min(100, (current / duration) * 100)) + "%";
          el["b-duration"].textContent = clockTime(duration);
        }
        el["b-elapsed"].textContent = clockTime(current);

        if (switching && Date.now() - switchingSince > SWITCH_TIMEOUT_MS) {
          rlog("[R][queue] switch never settled — clearing guard");
          switching = false;
        }

        if (playing) considerUpNext(current, duration);
        tickUpNext();
        if (upNext.armed && Date.now() >= upNext.firesAt) fireUpNext();
        // Unlike up-next, the skip prompt is also offered while PAUSED — a
        // viewer who paused mid-intro should still see it on resume.
        considerSkipSegment(current, duration);

        if (Date.now() - lastBroadcast >= STATE_BROADCAST_MS) broadcastState();
      }, TICK_MS);

      // ═══ [15] SUPPRESS THE BUILT-IN CHROME ═══════════════════════════
      // <cast-media-player> is not just a video surface: its shadow DOM
      // carries CAF's own TV overlay (poster, title, description AND a
      // progress bar with time labels) inside <tv-overlay-placeholder>. It
      // renders on top of the video, so with our overlay also drawing you get
      // two progress bars and two time readouts stacked on each other.
      //
      // The shadow root is created with {mode:"open"}, so we can inject a
      // stylesheet into it and hide the chrome while keeping the video.
      // Structure (CAF 3.0.x):
      //   #castPlayer > .background
      //                 .foreground > video#castMediaElement, #logo,
      //                               .spinner, #splash, #castSlideshowElement
      //                 <tv-overlay-placeholder>
      // Only the video and its caption container are kept — captions render
      // into .shaka-text-container and must NOT be hidden.
      //
      // NOTE: on TV devices CAF *replaces* <tv-overlay-placeholder> with a
      // real <tv-overlay> element once its module has loaded
      // (`e.replaceChild(c, d)` in the framework). Hiding only the
      // placeholder therefore does nothing by the time the overlay actually
      // draws — both element names have to be covered.
      var HIDE_CHROME_CSS =
        "tv-overlay,tv-overlay-placeholder,#logo,#splash,.spinner," +
        "#castSlideshowElement{display:none !important;}";

      function hideDefaultChrome(attempt) {
        var n = attempt || 0;
        try {
          var cmp = document.querySelector("cast-media-player");
          var root = cmp && cmp.shadowRoot;
          if (!root) {
            // The element may not be upgraded yet on a slow device.
            if (n < 10) setTimeout(function () { hideDefaultChrome(n + 1); }, 250);
            else rlog("[R][ui] no shadowRoot — built-in chrome left visible");
            return;
          }
          if (root.getElementById("streamio-hide-chrome")) return;
          var style = document.createElement("style");
          style.id = "streamio-hide-chrome";
          style.textContent = HIDE_CHROME_CSS;
          root.appendChild(style);
          rlog("[R][ui] built-in chrome suppressed (attempt " + n + ")");
        } catch (e) {
          // Cosmetic only — never let this stop playback.
          rlog("[R][ui] chrome suppression failed:", String(e && e.message));
        }
      }

      hideDefaultChrome(0);

      // ═══ [16] BOOT ═══════════════════════════════════════════════════
      // Smart displays render their own touch controls under our overlay.
      try {
        var caps = context.getDeviceCapabilities();
        if (caps && caps.touch_input_supported) {
          el.ui.classList.add("touch");
          rlog("[R][env] touch device — custom UI disabled");
        }
      } catch {
        /* getDeviceCapabilities is not available on every CAF build */
      }

      // Feature detection. Anything logged as undefined here must already have
      // a fallback path above — this is the file's early-warning system when
      // the rolling CAF v3 channel changes under an old device.
      rlog("[R][env] ua", navigator.userAgent);
      rlog(
        "[R][env] caf=" + str(cf.VERSION, "?"),
        "hlsHints=" + typeof messages.HlsSegmentFormat,
        "textTrackStyle=" + typeof messages.TextTrackStyle,
        "abort=" + typeof AbortController,
        "fromEntries=" + typeof Object.fromEntries,
        "tracksMgr=" + typeof player.getTextTracksManager
      );
      // Enum names drift between CAF builds and reading a member off a missing
      // one throws — which CAF reports as a 905, i.e. as "casting is broken".
      // Log which ones this device actually has.
      rlog(
        "[R][env] enums",
        "edgeType=" + typeof messages.TextTrackEdgeType,
        "fontFamilyA=" + typeof messages.TextTrackFontGenericFamily,
        "fontFamilyB=" + typeof messages.FontGenericFamily,
        "image=" + typeof messages.Image,
        "tvMeta=" + typeof messages.TvShowMediaMetadata,
        "track=" + typeof messages.Track
      );

      try {
        var options = new cf.CastReceiverOptions();
        // The default 5-minute idle timeout would kill the session while the
        // up-next card or an error card is on screen.
        options.maxInactivity = 3600;
        options.statusText = "Streamio";
        // QUEUE_NEXT/QUEUE_PREV are declared so a TV remote's ⏭/⏮ are routed
        // to this receiver at all — the platform withholds a command the app
        // doesn't claim to support, and on a dongle those buttons are the
        // only way to reach the Skip/Up Next prompts (see [13]). An undefined
        // member coerces to 0 in a bitwise OR, so an older CAF build that
        // lacks one of these degrades to simply not offering it.
        options.supportedCommands =
          messages.Command.SEEK |
          messages.Command.PAUSE |
          messages.Command.STREAM_VOLUME |
          messages.Command.STREAM_MUTE |
          messages.Command.SKIP_FORWARD |
          messages.Command.SKIP_BACKWARD |
          messages.Command.QUEUE_NEXT |
          messages.Command.QUEUE_PREV;

        var pc = new cf.PlaybackConfig();
        pc.segmentRequestRetryLimit = 3;
        pc.manifestRequestRetryLimit = 3;
        pc.autoResumeDuration = 5;
        options.playbackConfig = pc;

        context.start(options);
        rlog("[Streamio CAF Receiver] ready (options)");
      } catch (e) {
        // Option fields vary between CAF builds — never let one unknown field
        // stop the receiver from starting.
        rlog("[R][env] options rejected", String(e && e.message));
        context.start();
        rlog("[Streamio CAF Receiver] ready (bare)");
      }
    </script>
  </body>
</html>
